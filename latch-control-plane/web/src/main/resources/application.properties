quarkus.application.name=latch-control-plane
quarkus.oidc.application-type=service
quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL:http://localhost:8180/realms/latch}
quarkus.oidc.client-id=${OIDC_CLIENT_ID:latch-control-plane}
quarkus.oidc.token.issuer=${OIDC_ISSUER:}
quarkus.oidc.token.audience=${OIDC_AUDIENCE:}
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${JDBC_URL:jdbc:postgresql://localhost:5432/latch}
quarkus.datasource.username=${DB_USERNAME:latch}
quarkus.datasource.password=${DB_PASSWORD:latch}
quarkus.datasource.devservices.enabled=false
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.jackson.write-dates-as-timestamps=false
quarkus.http-problem.include-details=false

%test.quarkus.datasource.db-kind=h2
%test.quarkus.oidc.enabled=false
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:latch;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=sa
%test.quarkus.datasource.devservices.enabled=false
%test.quarkus.flyway.locations=db/migration-h2
%test.quarkus.flyway.migrate-at-start=true
%test.quarkus.hibernate-orm.schema-management.strategy=validate
